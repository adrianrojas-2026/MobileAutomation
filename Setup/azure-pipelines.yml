# 1. Continuous Integration Trigger: Run automatically on every push to main
trigger:
  - main # Triggers the pipeline when a push is made to the main branch

# 2. Automated Scheduled Triggers: Run automatically on a time-based schedule
schedules:
- cron: "0 2 * * 1-5" # Runs every Monday through Friday at 2:00 AM UTC
  displayName: "Nightly E2E Dual-App Regression Suite"
  branches:
    include:
      - main # Specifies which branch code to pull for the scheduled run
  always: true # Runs even if there are no new code changes since the last run

# Defines the machine pool where your dedicated Azure Server Agent is registered
pool:
  name: 'MyDedicatedMobilePool' # Replace with your actual Azure DevOps Agent Pool name

variables:
  buildConfiguration: 'Release'

steps:
# STEP 1: Install the required .NET SDK on the server
- task: UseDotNet@2
  displayName: 'Install Latest .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x' # Aligned to ensure compatibility with net10.0 compilation rules

# STEP 2: Restore NuGet packages (Appium, Selenium, NUnit, etc.)
- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet Packages'
  inputs:
    command: 'restore'
    projects: '**/*.csproj'

# STEP 3: Compile the Test Solution
- task: DotNetCoreCLI@2
  displayName: 'Build Automation Solution'
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: '--configuration $(buildConfiguration)'

# STEP 4: Boot all 6 Android Emulators concurrently via your custom Bootstrapper script
- task: PowerShell@2
  displayName: 'Launch 6-Emulator Testing Grid (Headless PowerShell)'
  inputs:
    filePath: '$(Build.SourcesDirectory)/Setup/Starf-MobileGrid.ps1'
    errorActionPreference: 'stop'

# STEP 5: Start the Appium Server safely in a completely isolated background process window
- task: PowerShell@2
  displayName: 'Start Background Appium Server Node'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Launching Appium Engine in background window stream..."
      # Start-Process prevents Azure DevOps from hanging on the live logging stream hook
      Start-Process -FilePath "cmd.exe" -ArgumentList "/c appium --port 4723 --allow-insecure chromedriver_autodownload" -WindowStyle Hidden
      
      Write-Host "Allowing 5 seconds for local Appium loop to bind port 4723..."
      Start-Sleep -Seconds 5
      
      # Optional quick-check validating loop presence
      netstat -ano | findstr 4723

# STEP 6: Execute the NUnit Dual-App Mobile Automation Tests
- task: DotNetCoreCLI@2
  displayName: 'Execute NUnit Automated Tests'
  inputs:
    command: 'test'
    projects: '**/*.csproj'
    arguments: '--configuration $(buildConfiguration) --no-build --logger:"trx;LogFileName=dual_test_results.trx"'
  continueOnError: true # Forces the pipeline to move to reporting even if tests fail

# STEP 7: Publish test execution outcomes to Azure DevOps Test dashboard
- task: PublishTestResults@2
  displayName: 'Publish Execution Reports'
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    mergeTestResults: true
    failTaskOnFailedTests: false # Keeps pipeline running to publish artifacts if asserts fail

# STEP 7.5: PUBLISH YOUR CUSTOM HTML REPORTS & SCREENSHOTS
- task: PublishBuildArtifacts@1
  displayName: 'Publish Custom HTML Automation Dashboard'
  inputs:
    # Dynamically tracking path structure variations matching current compile targets
    PathtoPublish: '$(Build.SourcesDirectory)/bin/Release/net10.0/Reports'
    ArtifactName: 'Mobile_Automation_HTML_Report'
    publishLocation: 'Container'
  condition: always() # Forces dashboard generation even if some tests threw assertion failures

# STEP 8: Clean up and safely force-kill ALL 6 emulators to release Server RAM & CPU completely
- task: PowerShell@2
  displayName: 'Teardown Android Emulators & Release Infrastructure RAM'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Sending soft-shutdown signals via ADB to clean execution blocks..."
      $emulators = @("emulator-5554", "emulator-5556", "emulator-5558", "emulator-5560", "emulator-5562", "emulator-5564")
      foreach ($emu in $emulators) {
          & "$env:ANDROID_HOME\platform-tools\adb.exe" -s $emu shell reboot -p 2>$null
      }
      
      Start-Sleep -Seconds 3
      
      Write-Host "Executing fallback hard-wipe of underlying window system process threads to prevent offline hang locks..."
      # Hard kill ensures no zombie threads remain hidden on your dedicated cloud VM
      Stop-Process -Name "qemu-system-x86_64" -Force -ErrorAction SilentlyContinue
      Stop-Process -Name "emulator" -Force -ErrorAction SilentlyContinue
      
      Write-Host "Flushing global ADB network connections..."
      & "$env:ANDROID_HOME\platform-tools\adb.exe" kill-server
      Write-Host "Teardown execution loop concluded successfully."
  condition: always() # Ensures your server agent's memory deck is wiped clean even if a scenario crashes
