# 1. Continuous Integration Trigger: Run automatically on every push to main
trigger:
  - main # Triggers the pipeline when a push is made to the main branch

# 2. Automated Scheduled Triggers: Run automatically on a time-based schedule
schedules:
- cron: "0 2 * * 1-5" # Runs every Monday through Friday at 2:00 AM UTC (Adjust timezone as needed)
  displayName: "Nightly E2E Dual-App Regression Suite"
  branches:
    include:
      - main # Specifies which branch code to pull for the scheduled run
  always: true # Runs even if there are no new code changes since the last run
  
# Defines the machine pool where your dedicated Azure Server Agent is registered
pool:
  name: 'MyDedicatedMobilePool' # Replace with your actual Azure DevOps Agent Pool name

variables:
  buildConfiguration: 'Release'

steps:
# STEP 1: Install the required .NET SDK on the server
- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x' # Adjust this to match the .NET version of your Visual Studio Code project

# STEP 2: Restore NuGet packages (Appium, Selenium, NUnit, etc.)
- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet Packages'
  inputs:
    command: 'restore'
    projects: '**/*.csproj'

# STEP 3: Compile the Test Solution
- task: DotNetCoreCLI@2
  displayName: 'Build Automation Solution'
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: '--configuration $(buildConfiguration)'

# STEP 4: Boot both Android Emulators concurrently in the background
# Make sure "Android_12" and "Android_14" match your exact AVD names in the Azure Server
- script: |
    echo "Booting Flex App Emulator (Android 12)..."
    start /B %ANDROID_HOME%\emulator\emulator.exe -avd Android_12 -port 5554 -no-snapshot-load -no-boot-anim
    
    echo "Booting Driver App Emulator (Android 14)..."
    start /B %ANDROID_HOME%\emulator\emulator.exe -avd Android_14 -port 5556 -no-snapshot-load -no-boot-anim
    
    echo "Waiting for Android Debug Bridge (ADB) to detect both devices..."
    %ANDROID_HOME%\platform-tools\adb wait-for-device
    echo "Both emulators are online and responsive."
  displayName: 'Launch Android Emulators (Background)'

# STEP 5: Start the Appium Server in the background
# The flag '--allow-insecure chromedriver_autodownload' is highly recommended for hybrid elements
- script: |
    echo "Starting Appium Server on default port 4723..."
    start /B appium --port 4723 --allow-insecure chromedriver_autodownload
  displayName: 'Start Appium Server'

# STEP 6: Execute the NUnit Dual-App Mobile Automation Tests
- task: DotNetCoreCLI@2
  displayName: 'Execute NUnit Automated Tests'
  inputs:
    command: 'test'
    projects: '**/*.csproj'
    arguments: '--configuration $(buildConfiguration) --no-build --logger:"trx;LogFileName=dual_test_results.trx"'
  continueOnError: true # Forces the pipeline to move to reporting even if tests fail

# STEP 7: Publish test execution outcomes to Azure DevOps Test dashboard
- task: PublishTestResults@2
  displayName: 'Publish Execution Reports'
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    mergeTestResults: true
    failTaskOnFailedTests: false # Flashes the pipeline red if any NUnit assert fails

# 🚀 STEP 7.5: PUBLISH YOUR CUSTOM HTML REPORTS & SCREENSHOTS
- task: PublishBuildArtifacts@1
  displayName: 'Publish Custom HTML Automation Dashboard'
  inputs:
    # Points to the exact workspace directory where your Reports folder gets generated
    PathtoPublish: '$(Build.SourcesDirectory)/bin/Release/net8.0/Reports' # Adjust path if your generator saves it elsewhere (e.g., project root)
    ArtifactName: 'Mobile_Automation_HTML_Report'
    publishLocation: 'Container'
  condition: always() # Forces dashboard generation even if some tests threw assertion failures

# STEP 8: Clean up and safely close emulators to release Server RAM & CPU
- script: |
    echo "Terminating emulator sessions to clean up Azure Server resources..."
    "%ANDROID_HOME%\platform-tools\adb.exe" -s emulator-5554 shell reboot -p
    "%ANDROID_HOME%\platform-tools\adb.exe" -s emulator-5556 shell reboot -p
    echo "Cleanup complete."
  displayName: 'Teardown Android Emulators'
  condition: always()
