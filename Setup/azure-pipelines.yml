# ==============================================================================
# MOBILE SUITE (Flex + Driver App on Android emulators, local Aspire backend)
# Everything runs on one self-hosted Windows agent: the emulators share one simulated Bluetooth only on the same
# host, and Aspire's containers and the emulators both need virtualization (nested, on a VM). The steps themselves
# are Setup\Run-Suite.ps1, the same script a local run uses.
#
# Agent prerequisites (see README, "Running in Azure DevOps"): Windows 11 / Server 2022 with Hyper-V, Windows
# Hypervisor Platform and WSL2; Docker; .NET 10 SDK; JDK 21; Node + pnpm; Appium 2+ with the UiAutomator2 driver;
# Android SDK with the grid's AVDs (Setup\Start-MobileGrid.ps1); the agent running as the user that owns the AVDs,
# interactively (not as a service); the AppHost's settings / user secrets (e.g. the SQL Server password).
# ==============================================================================

# Runs on the schedule or by hand; a push to the test repo does not start a 30+ minute emulator run
trigger: none
pr: none

schedules:
  - cron: "0 7 * * 1-5"   # 07:00 UTC, Monday to Friday
    displayName: Nightly mobile suite
    branches:
      include: [main]
    always: true

parameters:
  - name: filter
    displayName: Tests to run (dotnet test --filter)
    type: string
    default: Category=BLE
  # Tests that need Flex Web (RunMode=Web), e.g. NDT-5 in BLE-R1-C2, run in a second pass after the mobile suite,
  # against the same Aspire backend. 'none' skips that pass. Device tests in the filter just report Ignored there
  - name: webFilter
    displayName: Browser tests to run after the mobile suite (dotnet test --filter, or none)
    type: string
    default: none
  - name: nodes
    displayName: Emulator nodes
    type: string
    default: 2,3
  - name: uiSource
    displayName: Flex / Driver App code to build
    type: string
    default: blePoc
    values:
      - blePoc          # GitHub recoverytrac-ble-poc: the BLE handoff code, until it is merged into RecoveryTrac.UI
      - aspireSubmodule # the RecoveryTrac.UI submodule the Aspire repo pins
  - name: rebuildApks
    displayName: Build and install fresh debug APKs
    type: boolean
    default: true

resources:
  repositories:
    - repository: aspire
      type: git
      name: RecoveryTrac/Aspire
      ref: refs/heads/main
    - repository: blePoc
      type: github
      name: TetraTec-BP-Team/recoverytrac-ble-poc
      endpoint: GitHub-TetraTec   # TODO: GitHub service connection with read access to the repo
      ref: refs/heads/main
  # TODO: once the BLE code ships to QA, run after the UI pipelines:
  # pipelines:
  #   - pipeline: driverAppQa
  #     source: 'RecoveryTrac.UI - Driver-App - QA'
  #     trigger: true

pool:
  name: MobileGrid   # TODO: the self-hosted pool System Engineering creates

variables:
  # Secret variables: TestSettings-LoginEmail, TestSettings-LoginPassword, and the same per node
  # (TestSettings-Node2-LoginEmail, ...). Mapped to the tests' TestSettings__<key> environment variables below
  - group: MobileAutomation-Secrets
  - name: resultsDirectory
    value: $(Agent.TempDirectory)/mobile-results
  - name: uiPath
    ${{ if eq(parameters.uiSource, 'blePoc') }}:
      value: $(Pipeline.Workspace)/s/RecoveryTrac.UI-ble/apps
    ${{ else }}:
      value: $(Pipeline.Workspace)/s/Aspire/RecoveryTrac.UI/apps

jobs:
  - job: MobileSuite
    displayName: Mobile suite (${{ parameters.filter }})
    timeoutInMinutes: 180
    workspace:
      clean: outputs
    steps:
      - checkout: self
        path: s/MobileAutomation
        clean: true
      # Submodules are fetched below: .gitmodules uses SSH URLs, which the checkout task cannot use
      - checkout: aspire
        path: s/Aspire
        clean: true
        persistCredentials: true
      - ${{ if eq(parameters.uiSource, 'blePoc') }}:
          - checkout: blePoc
            path: s/RecoveryTrac.UI-ble
            clean: true

      - pwsh: |
          # Rewrite the SSH submodule URLs to HTTPS and authenticate with the job's token
          git config --global url."https://dev.azure.com/TDRRecoveryTrac/RecoveryTrac/_git/".insteadOf "git@ssh.dev.azure.com:v3/TDRRecoveryTrac/RecoveryTrac/"
          git -c http.extraheader="AUTHORIZATION: bearer $(System.AccessToken)" submodule update --init --recursive --depth 1
          if ($LASTEXITCODE -ne 0) { throw "Submodule update failed." }
        workingDirectory: $(Pipeline.Workspace)/s/Aspire
        displayName: Aspire submodules

      - task: UseDotNet@2
        displayName: .NET 10 SDK
        inputs:
          packageType: sdk
          version: 10.x

      - pwsh: |
          & ./Setup/Run-Suite.ps1 `
            -AspirePath "$(Pipeline.Workspace)/s/Aspire" `
            -UiPath "$(uiPath)" `
            -Nodes ${{ parameters.nodes }} `
            -Filter "${{ parameters.filter }}" `
            -ResultsDirectory "$(resultsDirectory)" `
            -RebuildApks:$${{ parameters.rebuildApks }} `
            -RunMode Mobile `
            -Headless -Teardown:$${{ eq(parameters.webFilter, 'none') }}
          exit $LASTEXITCODE
        workingDirectory: $(Pipeline.Workspace)/s/MobileAutomation
        displayName: Run the mobile suite
        env:
          TestSettings__LoginEmail: $(TestSettings-LoginEmail)
          TestSettings__LoginPassword: $(TestSettings-LoginPassword)
          TestSettings__Node2__LoginEmail: $(TestSettings-Node2-LoginEmail)
          TestSettings__Node2__LoginPassword: $(TestSettings-Node2-LoginPassword)
          TestSettings__Node3__LoginEmail: $(TestSettings-Node3-LoginEmail)
          TestSettings__Node3__LoginPassword: $(TestSettings-Node3-LoginPassword)

      # Browser pass: same Aspire (left running by the mobile step), Chrome (Flex) + Edge (Driver App); then teardown
      - ${{ if ne(parameters.webFilter, 'none') }}:
          - pwsh: |
              & ./Setup/Run-Suite.ps1 `
                -AspirePath "$(Pipeline.Workspace)/s/Aspire" `
                -Nodes ${{ parameters.nodes }} `
                -Filter "${{ parameters.webFilter }}" `
                -ResultsDirectory "$(resultsDirectory)" `
                -RunMode Web `
                -Teardown
              exit $LASTEXITCODE
            workingDirectory: $(Pipeline.Workspace)/s/MobileAutomation
            displayName: Run the browser tests (${{ parameters.webFilter }})
            condition: succeededOrFailed()
            env:
              TestSettings__LoginEmail: $(TestSettings-LoginEmail)
              TestSettings__LoginPassword: $(TestSettings-LoginPassword)
              TestSettings__Node2__LoginEmail: $(TestSettings-Node2-LoginEmail)
              TestSettings__Node2__LoginPassword: $(TestSettings-Node2-LoginPassword)
              TestSettings__Node3__LoginEmail: $(TestSettings-Node3-LoginEmail)
              TestSettings__Node3__LoginPassword: $(TestSettings-Node3-LoginPassword)

      - task: PublishTestResults@2
        displayName: Publish test results
        condition: always()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: '**/mobile-tests.trx'
          searchFolder: $(resultsDirectory)
          testRunTitle: Mobile suite (${{ parameters.filter }})
          # The suite step already fails the run when a test fails
          failTaskOnFailedTests: false

      - ${{ if ne(parameters.webFilter, 'none') }}:
          - task: PublishTestResults@2
            displayName: Publish browser test results
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**/web-tests.trx'
              searchFolder: $(resultsDirectory)
              testRunTitle: Browser tests (${{ parameters.webFilter }})
              failTaskOnFailedTests: false

      - publish: $(resultsDirectory)
        artifact: mobile-results-$(System.JobAttempt)
        displayName: Publish HTML report, baselines, screenshots and logs
        condition: always()

      # Run-Suite -Teardown already stops everything; this covers a cancelled or timed-out run
      - pwsh: ./Setup/Run-Suite.ps1 -Stop -Nodes ${{ parameters.nodes }} -ResultsDirectory "$(resultsDirectory)"
        workingDirectory: $(Pipeline.Workspace)/s/MobileAutomation
        displayName: Stop emulators, Appium and Aspire
        condition: always()
